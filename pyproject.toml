[project]
name = "pipelinespec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6", 
    "langchain-openai>=1.7.2",
    "mitmproxy>=12.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "singleton-decorator>=1.0.0",
    "z3-solver>=5.3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

mlx = [
    "mlx-lm>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sample = "pipelinespec.cli.sample:main"
pipelinespec = "pipelinespec.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
